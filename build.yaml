# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  - board: nice_nano_v2
    shield: molekula nice_view_adapter nice_view_hid_adapter raw_hid_adapter
    artifact-name: molekula_nice_view_hid

  - board: nice_nano_v2
    shield: molekula
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: molekula_dongle_kb

  - board: seeeduino_xiao_ble
    shield: molekula_dongle underdongle_adapter raw_hid_adapter
    artifact-name: molekula_dongle
    
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings_reset_kb

  - board: seeeduino_xiao_ble
    shield: settings_reset
    artifact-name: settings_reset_dongle